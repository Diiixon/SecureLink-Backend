
# ============================================
# Aplicaci\u00f3n - Microservicio de Estad\u00edsticas
# ============================================
spring.application.name=microservicio-Stats
server.port=8082

# ============================================
# Configuraci\u00f3n de Base de Datos MySQL
# ============================================
# Preferir variables de entorno para producci\u00f3n: DB_URL, DB_USER, DB_PASS
# Ejemplo DB_URL: jdbc:mysql://your-rds-endpoint:3306/bd_securelink
spring.datasource.url=${DB_URL:jdbc:mysql://securelink.cz53cv2gj6ra.us-east-1.rds.amazonaws.com/bd_securelink}
spring.datasource.username=${DB_USER:admin}
spring.datasource.password=${DB_PASS:viwge4-zojwam-doXfyp}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Pool de conexiones
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# ============================================
# Configuraci\u00f3n JPA/Hibernate
# ============================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ============================================
# CORS - Or\u00edgenes Permitidos
# ============================================
# M\u00faltiples or\u00edgenes separados por coma
# Ejemplo: http://localhost:5173,http://localhost:3000,https://mi-dominio.com
cors.allowed-origins=${CORS_ORIGINS:http://s3-securelink.s3-website-us-east-1.amazonaws.com}

# ============================================
# Logging
# ============================================
logging.level.root=INFO
logging.level.grupo10.Stats=DEBUG
logging.level.org.springframework.web=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n