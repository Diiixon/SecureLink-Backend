spring.application.name=auth-service

# --- Puerto del Servidor ---
# Usamos 8080 para el servicio de autenticación (el de análisis usa 8081)
server.port=8080

# --- Configuración de la Base de Datos MySQL ---
# Esta es la URL de conexión a tu Workbench local
spring.datasource.url=jdbc:mysql://bdsecurelink.cz53cv2gj6ra.us-east-1.rds.amazonaws.com/bd_securelink

# Tu usuario y contraseña de MySQL
spring.datasource.username=admin
spring.datasource.password=viwge4-zojwam-doXfyp

# --- Configuración de JPA (Hibernate) ---
# Le dice a Spring que estamos usando el "dialecto" de MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# (¡Importante!) ddl-auto=update:
# Esto le dice a Hibernate que mire tu clase @Entity (User.java)
# y automáticamente cree o actualice la tabla 'users' en la base de datos 'auth_db'
# cuando el servidor arranque.
spring.jpa.hibernate.ddl-auto=update

# Clave secreta para firmar los JWT (en formato Base64)
jwt.secret=Y2hhbmdlX3RoaXNfc2VjcmV0X2tleV90b19zb21ldGhpbmdfcmFuZG9tX2FuZF9sb25nCg==

# Permitir que un bean sobrescriba a otro (útil para despliegues donde hay definiciones duplicadas)
spring.main.allow-bean-definition-overriding=true
